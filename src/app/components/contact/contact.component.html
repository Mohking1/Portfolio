<section id="contact" class="section-container py-28 relative">
  
  <!-- Subtle ambient glow spotlight behind contact card -->
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-[500px] h-[300px] bg-emerald-500/10 blur-[120px] rounded-full pointer-events-none -z-10"></div>

  <div class="max-w-3xl mx-auto glass-card rounded-3xl p-8 sm:p-12 text-center relative overflow-hidden shadow-2xl border border-white/[0.08]" data-aos="fade-up">
    
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/25 text-emerald-400 font-mono text-xs mb-6">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span>06. Get In Touch · What’s Next?</span>
    </div>

    <h2 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight mb-6">
      Have an opportunity or project?
    </h2>

    <p class="text-slate text-base sm:text-lg mb-8 leading-relaxed max-w-xl mx-auto font-normal">
      I’m open to full-time AI/ML Engineering roles, research collaborations, and interesting applied AI projects. Feel free to reach out directly.
    </p>

    <!-- Email Address Display Pill -->
    <div class="mb-10 inline-flex items-center gap-2 px-6 py-3 bg-[#07090e] border border-white/[0.08] rounded-full shadow-inner">
      <span class="text-xs font-mono text-slate-500">Direct:</span>
      <a [href]="'mailto:' + email" class="text-sm font-mono text-emerald-400 hover:text-emerald-300 transition-colors font-semibold">
        {{ email }}
      </a>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap justify-center items-center gap-4">
      <a [href]="'mailto:' + email"
        class="inline-flex items-center gap-2 px-8 py-3.5 bg-emerald-400 text-black font-bold rounded-xl font-mono text-sm hover:bg-emerald-300 transition-all duration-200 shadow-lg shadow-emerald-500/20 hover:-translate-y-0.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <span>Email Me</span>
      </a>

      <a [href]="linkedin" target="_blank" rel="noopener noreferrer"
        class="inline-flex items-center gap-2 px-7 py-3.5 border border-white/10 hover:border-emerald-400/50 bg-white/[0.03] text-white rounded-xl font-mono text-sm font-medium transition-all duration-200 hover:-translate-y-0.5">
        <span>LinkedIn ↗</span>
      </a>

      <a [href]="github" target="_blank" rel="noopener noreferrer"
        class="inline-flex items-center gap-2 px-7 py-3.5 border border-white/10 hover:border-emerald-400/50 bg-white/[0.03] text-white rounded-xl font-mono text-sm font-medium transition-all duration-200 hover:-translate-y-0.5">
        <span>GitHub ↗</span>
      </a>
    </div>

  </div>
</section>
