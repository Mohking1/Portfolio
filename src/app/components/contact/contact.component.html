<section id="contact" class="section-container text-center py-24">
  <div class="max-w-2xl mx-auto" data-aos="fade-up">
    <p class="text-green-400 font-mono text-sm mb-3">05. What’s Next?</p>
    <h2 class="text-3xl sm:text-5xl font-bold text-lightest-slate mb-6">
      Have an opportunity or project?
    </h2>
    <p class="text-slate text-base sm:text-lg mb-8 leading-relaxed">
      I’m open to full-time AI/ML Engineering roles, research collaborations, and interesting applied AI projects. Feel free to reach out directly.
    </p>

    <!-- Email Address Display -->
    <div class="mb-10 inline-block px-5 py-2.5 bg-navy-light/80 border border-lightest-navy/60 rounded-full">
      <span class="text-xs font-mono text-slate mr-2">Email:</span>
      <a [href]="'mailto:' + email" class="text-sm font-mono text-green-400 hover:underline">
        {{ email }}
      </a>
    </div>

    <!-- Action Buttons: Email, LinkedIn, GitHub -->
    <div class="flex flex-wrap justify-center items-center gap-4">
      <a [href]="'mailto:' + email"
        class="px-8 py-3.5 bg-green-400 text-black font-semibold rounded font-mono text-sm hover:bg-green-300 transition-all duration-200 shadow-lg shadow-green-400/10">
        ✉ Email Me
      </a>
      <a [href]="linkedin" target="_blank" rel="noopener noreferrer"
        class="px-8 py-3.5 border border-green-400 text-green-400 rounded font-mono text-sm hover:bg-green-400/10 transition-all duration-200">
        LinkedIn ↗
      </a>
      <a [href]="github" target="_blank" rel="noopener noreferrer"
        class="px-8 py-3.5 border border-lightest-navy/80 text-lightest-slate rounded font-mono text-sm hover:border-green-400 hover:text-green-400 transition-all duration-200">
        GitHub ↗
      </a>
    </div>
  </div>
</section>
