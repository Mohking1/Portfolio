<header class="fixed top-0 left-0 right-0 z-50 transition-transform duration-300"
        [ngClass]="isHeaderHidden ? '-translate-y-full' : 'translate-y-0'">
  <nav class="w-full bg-[#07090e]/80 backdrop-blur-xl border-b border-white/[0.08]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <!-- Logo / Monogram -->
        <div class="flex items-center gap-3">
          <a href="#" class="group flex items-center gap-3 transition-transform duration-200 hover:scale-105" aria-label="Home">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-cyan-500 p-[1px] shadow-lg shadow-emerald-500/10">
              <div class="w-full h-full bg-[#07090e] rounded-[11px] flex items-center justify-center">
                <span class="font-mono font-bold text-sm bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent group-hover:from-emerald-300 group-hover:to-cyan-300">ML</span>
              </div>
            </div>
            <div class="hidden sm:block text-left">
              <span class="block text-sm font-bold text-white tracking-tight">Mohammed Lokhandwala</span>
              <span class="block text-[11px] font-mono text-emerald-400/90">AI/ML Engineer</span>
            </div>
          </a>
        </div>

        <!-- Desktop Navigation & Actions -->
        <div class="hidden md:flex items-center space-x-1 lg:space-x-3">
          <a href="#about-me" class="nav-link">About</a>
          <a href="#experience" class="nav-link">Experience</a>
          <a href="#projects" class="nav-link">Projects</a>
          <a href="#capabilities" class="nav-link">Capabilities</a>
          <a href="#achievements" class="nav-link">Achievements</a>
          <a href="#contact" class="nav-link">Contact</a>

          <!-- Status indicator -->
          <div class="hidden xl:flex items-center gap-2 pl-4 pr-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-mono ml-2">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span>Available for Roles</span>
          </div>

          <!-- Resume Button -->
          <a href="/assets/resume.pdf" target="_blank" rel="noopener noreferrer"
            class="ml-3 inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-emerald-400 text-black font-semibold text-xs font-mono hover:bg-emerald-300 transition-all shadow-md shadow-emerald-500/10">
            <span>Resume</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </a>
        </div>

        <!-- Mobile Menu Button -->
        <div class="flex items-center gap-2 md:hidden">
          <a href="/assets/resume.pdf" target="_blank" rel="noopener noreferrer"
            class="px-3 py-1.5 rounded-lg bg-emerald-400 text-black font-semibold text-xs font-mono hover:bg-emerald-300 transition-all">
            Resume ↗
          </a>
          <button class="p-2 rounded-lg text-slate hover:text-white hover:bg-white/[0.05] transition-colors"
                  (click)="toggleMenu()"
                  [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16M4 18h16" />
              <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Mobile Drawer Overlay -->
    <div class="md:hidden">
      <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 transition-opacity duration-300"
           [ngClass]="{'opacity-100 visible': isMenuOpen, 'opacity-0 invisible pointer-events-none': !isMenuOpen}"
           (click)="toggleMenu()">
      </div>

      <div class="fixed right-0 top-0 w-[min(80vw,340px)] h-full z-50 bg-[#0c1222] border-l border-white/[0.08] shadow-2xl transform transition-transform duration-300 flex flex-col justify-between"
           [ngClass]="{'translate-x-0': isMenuOpen, 'translate-x-full': !isMenuOpen}">
        
        <div>
          <!-- Close Header -->
          <div class="flex justify-between items-center px-6 py-5 border-b border-white/[0.08]">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-emerald-400/20 border border-emerald-400/40 flex items-center justify-center font-mono font-bold text-xs text-emerald-400">
                ML
              </div>
              <span class="font-bold text-sm text-white">Menu</span>
            </div>
            <button (click)="toggleMenu()" aria-label="Close menu"
                    class="p-2 text-slate hover:text-white rounded-lg transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <!-- Mobile Nav Links -->
          <div class="flex flex-col p-6 space-y-4">
            <a href="#about-me" class="text-base font-medium text-slate hover:text-white py-2 border-b border-white/[0.04]" (click)="toggleMenu()">About</a>
            <a href="#experience" class="text-base font-medium text-slate hover:text-white py-2 border-b border-white/[0.04]" (click)="toggleMenu()">Experience</a>
            <a href="#projects" class="text-base font-medium text-slate hover:text-white py-2 border-b border-white/[0.04]" (click)="toggleMenu()">Projects</a>
            <a href="#capabilities" class="text-base font-medium text-slate hover:text-white py-2 border-b border-white/[0.04]" (click)="toggleMenu()">Capabilities</a>
            <a href="#achievements" class="text-base font-medium text-slate hover:text-white py-2 border-b border-white/[0.04]" (click)="toggleMenu()">Achievements</a>
            <a href="#contact" class="text-base font-medium text-slate hover:text-white py-2 border-b border-white/[0.04]" (click)="toggleMenu()">Contact</a>
          </div>
        </div>

        <!-- Mobile Drawer Bottom -->
        <div class="p-6 border-t border-white/[0.08] space-y-4">
          <div class="flex items-center gap-2 text-xs font-mono text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>Available for AI/ML Roles</span>
          </div>
          <a href="/assets/resume.pdf" target="_blank" rel="noopener noreferrer"
            class="w-full py-3 bg-emerald-400 text-black font-semibold rounded-lg text-center font-mono text-sm block">
            Download Resume ↗
          </a>
        </div>
      </div>
    </div>

  </nav>
</header>
